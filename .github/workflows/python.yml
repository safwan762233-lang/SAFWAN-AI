name: SAFWAN AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app
      - name: Import application and initialize database
        run: |
          python -c "from app.main import app; from app.db import init_db; init_db(); print(app.title)"
